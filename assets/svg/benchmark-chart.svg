    <circle cx="34" cy="32" r="4.5" fill="#0891b2" stroke="#38bdf8" stroke-width="1" />
    <line x1="34" y1="18" x2="34" y2="23" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="34" y1="41" x2="34" y2="46" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="20" y1="32" x2="25" y2="32" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="43" y1="32" x2="48" y2="32" stroke="#22d3ee" stroke-width="1.5" />

