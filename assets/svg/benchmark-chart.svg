    <text x="62" y="44" class="font-body" font-size="11" font-weight="400" fill="#94a3b8">Image sharpness &amp; clarity</text>

    <!-- Advantage Badge -->
    <rect x="16" y="58" width="168" height="22" rx="6" fill="#0891b2" fill-opacity="0.16" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
    <text x="100" y="73" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#38bdf8">💎 300 DPI LOSSLESS RAW</text>

    <!-- Vertical Technical Divider -->
    <line x1="208" y1="14" x2="208" y2="80" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="2 2" stroke-width="1" />

    <!-- Right Side: Graphic Bars & Numeric Readouts -->
    <!-- Row 1: Local Engine -->
    <circle cx="226" cy="30" r="3.5" fill="#06b6d4" />
    <text x="236" y="34" class="font-body" font-size="11.5" font-weight="600" fill="#e2e8f0">Local Engine</text>

    <!-- Bar Track -->
    <rect x="330" y="21" width="330" height="18" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <line x1="412" y1="21" x2="412" y2="39" stroke="#1e293b" stroke-width="1" />
    <line x1="495" y1="21" x2="495" y2="39" stroke="#1e293b" stroke-width="1" />
    <line x1="577" y1="21" x2="577" y2="39" stroke="#1e293b" stroke-width="1" />
    <!-- Filled Bar (300 DPI - 100% full bar) -->
    <rect x="330" y="21" width="330" height="18" rx="5" fill="url(#dpiLocalGrad)" filter="url(#softGlow)" />
    <line x1="332" y1="23" x2="658" y2="23" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />

    <!-- Value Metric -->
    <text x="676" y="34" class="font-mono">
      <tspan font-size="13.5" font-weight="800" fill="#38bdf8">300 DPI</tspan>
      <tspan font-size="11" font-weight="500" fill="#94a3b8"> Lossless</tspan>
    </text>

    <!-- Row 2: Free App -->
    <circle cx="226" cy="67" r="3.5" fill="#f59e0b" />
    <text x="236" y="71" class="font-body" font-size="11.5" font-weight="500" fill="#94a3b8">Free Mobile App</text>

    <!-- Bar Track -->
    <rect x="330" y="58" width="330" height="18" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <line x1="412" y1="58" x2="412" y2="76" stroke="#1e293b" stroke-width="1" />
    <line x1="495" y1="58" x2="495" y2="76" stroke="#1e293b" stroke-width="1" />
    <line x1="577" y1="58" x2="577" y2="76" stroke="#1e293b" stroke-width="1" />
    <!-- Filled Bar (72-150 DPI - 40% fill) -->
    <rect x="330" y="58" width="132" height="18" rx="5" fill="url(#dpiCloudGrad)" />

    <!-- Value Metric -->
    <text x="676" y="71" class="font-mono">
      <tspan font-size="13" font-weight="700" fill="#fbbf24">72–150 DPI</tspan>
      <tspan font-size="11" font-weight="500" fill="#64748b"> Compressed</tspan>
    </text>
  </g>

  <!-- ==================== BENCHMARK CARD 3: FILE LIMITS ==================== -->
  <g transform="translate(32, 276)" filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect width="836" height="94" rx="12" fill="url(#cardBgGrad)" stroke="url(#cardBorderGrad)" stroke-width="1.2" />

    <!-- Left Metric Info Area -->
    <!-- Icon Container -->
    <rect x="16" y="14" width="36" height="36" rx="8" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" />
    <!-- Infinity / Unlocked Icon -->
    <path d="M25 32c0-3.3 2.7-6 6-6 3.1 0 5.2 2.3 7 4.2 1.8-1.9 3.9-4.2 7-4.2 3.3 0 6 2.7 6 6s-2.7 6-6 6c-3.1 0-5.2-2.3-7-4.2-1.8 1.9-3.9 4.2-7 4.2-3.3 0-6-2.7-6-6z" fill="none" stroke="#818cf8" stroke-width="1.8" />

    <text x="62" y="29" class="font-title" font-size="14.5" font-weight="700" fill="#f8fafc">Output &amp; Page Limits</text>
    <text x="62" y="44" class="font-body" font-size="11" font-weight="400" fill="#94a3b8">Volume restrictions &amp; watermarks</text>

    <!-- Advantage Badge -->
    <rect x="16" y="58" width="168" height="22" rx="6" fill="#4338ca" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <text x="100" y="73" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#a78bfa">♾️ UNRESTRICTED &amp; PRIVATE</text>

    <!-- Vertical Technical Divider -->
