    <line x1="412" y1="21" x2="412" y2="39" stroke="#1e293b" stroke-width="1" />
    <line x1="495" y1="21" x2="495" y2="39" stroke="#1e293b" stroke-width="1" />
    <line x1="577" y1="21" x2="577" y2="39" stroke="#1e293b" stroke-width="1" />
    <!-- Filled Bar (Unlimited capacity - 100% full bar) -->
    <rect x="330" y="21" width="330" height="18" rx="5" fill="url(#limitsLocalGrad)" filter="url(#softGlow)" />
    <line x1="332" y1="23" x2="658" y2="23" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />

    <!-- Value Metric -->
    <text x="676" y="34" class="font-mono">
      <tspan font-size="13.5" font-weight="800" fill="#a78bfa">Unlimited</tspan>
      <tspan font-size="11" font-weight="500" fill="#94a3b8"> (No Quotas)</tspan>
    </text>

    <!-- Row 2: Free App -->
    <circle cx="226" cy="67" r="3.5" fill="#f43f5e" />
    <text x="236" y="71" class="font-body" font-size="11.5" font-weight="500" fill="#94a3b8">Free Mobile App</text>

    <!-- Bar Track -->
    <rect x="330" y="58" width="330" height="18" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <line x1="412" y1="58" x2="412" y2="76" stroke="#1e293b" stroke-width="1" />
    <line x1="495" y1="58" x2="495" y2="76" stroke="#1e293b" stroke-width="1" />
    <line x1="577" y1="58" x2="577" y2="76" stroke="#1e293b" stroke-width="1" />
    <!-- Filled Bar (Limited / Paywalls - 20% fill) -->
    <rect x="330" y="58" width="66" height="18" rx="5" fill="url(#limitsCloudGrad)" />

    <!-- Value Metric -->
    <text x="676" y="71" class="font-mono">
      <tspan font-size="13" font-weight="700" fill="#fb7185">Limited</tspan>
      <tspan font-size="11" font-weight="500" fill="#64748b"> (Pages / Ads)</tspan>
    </text>
  </g>

  <!-- ==================== FOOTER SUMMARY BAR ==================== -->
  <g transform="translate(32, 380)">
    <!-- Pill Bar Container -->
    <rect width="836" height="28" rx="7" fill="#0d1527" stroke="#1e293b" stroke-width="1" />

    <!-- Feature Item 1: Privacy -->
    <g transform="translate(24, 6)">
      <!-- Mini Shield Icon -->
      <path d="M7 2L2 4v4c0 3.3 2.1 6.4 5 7.2 2.9-.8 5-3.9 5-7.2V4L7 2z" fill="none" stroke="#10b981" stroke-width="1.2" />
      <text x="18" y="11" class="font-body" font-size="10.5" font-weight="600" fill="#cbd5e1">100% Local Processing &amp; Privacy</text>
    </g>

    <!-- Feature Item 2: Zero Cloud Lag -->
    <g transform="translate(315, 6)">
      <!-- Mini Lightning Icon -->
      <path d="M7 1L3 8h4l-1 6 6-7H8l2-7z" fill="none" stroke="#06b6d4" stroke-width="1.2" />
      <text x="18" y="11" class="font-body" font-size="10.5" font-weight="600" fill="#cbd5e1">Zero Cloud Latency or Bandwidth Caps</text>
    </g>

    <!-- Feature Item 3: Multi-Page Export -->
    <g transform="translate(615, 6)">
      <!-- Mini Document / Check Icon -->
      <rect x="3" y="1" width="10" height="13" rx="1.5" fill="none" stroke="#818cf8" stroke-width="1.2" />
      <path d="M6 7l1.5 1.5 3-3" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" />
      <text x="18" y="11" class="font-body" font-size="10.5" font-weight="600" fill="#cbd5e1">No Watermarks • Lossless PDF Export</text>
